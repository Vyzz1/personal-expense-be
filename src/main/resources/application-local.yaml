server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: personal-expense-be

spring:
  application:
    name: personal-expense-be

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
    database: postgresql

  datasource:
    url: jdbc:postgresql://localhost:5438/personal_expense
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/my-realm
          jwk-set-uri: http://localhost:9090/realms/my-realm/protocol/openid-connect/certs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
app:
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:5173
